<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teacher app — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F3; font-family: 'IBM Plex Sans', 'Noto Sans Devanagari', system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 22px 20px 12px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #4F5B57">Friday, 9 Oct</span>
      <span style="font-size: 20px; font-weight: 600">Good morning, Sunita</span>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #E3EFEF; color: #08393F; display: flex; align-items: center; justify-content: center; font-weight: 600">SR</div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <a href="TeacherAttendance.dc.html" style="background: #0E5A63; color: #FFFFFF; border-radius: 16px; padding: 16px; text-decoration: none; display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #CFE2E2">Class teacher · 8-B</span>
        <span style="font-size: 17px; font-weight: 600">Mark today's attendance</span>
        <span style="font-size: 12.5px; color: #CFE2E2">Due by 10:00 am · 38 students</span>
      </span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </a>

    <section style="background: #FFFFFF; border: 1px solid #DDE2DE; border-radius: 14px; padding: 6px 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0 4px"><h2 style="margin: 0; font-size: 15px; font-weight: 600">My periods today</h2><span style="font-size: 12px; color: #4F5B57">6 periods</span></div>
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="6">
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid #EEF1EF">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #4F5B57; width: 44px">{{p.time}}</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">{{p.cls}}</span><span style="font-size: 12px; color: {{p.noteColor}}">{{p.note}}</span></span>
          <span style="font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: {{p.tagBg}}; color: {{p.tagFg}}">{{p.tag}}</span>
        </div>
      </sc-for>
    </section>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="min-height: 72px; border-radius: 14px; border: 1px solid #DDE2DE; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #17201D">Post homework</button>
      <a href="#marks" style="min-height: 72px; border-radius: 14px; border: 1px solid #DDE2DE; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #17201D; text-decoration: none; display: flex; align-items: center; justify-content: center; text-align: center">Enter marks</a>
      <button style="min-height: 72px; border-radius: 14px; border: 1px solid #DDE2DE; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #17201D">Messages · 3</button>
    </div>
  </div>

  <nav aria-label="App" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDE2DE; padding: 6px 4px 14px">
    <a href="TeacherHome.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11.5px; font-weight: 600; color: #0E5A63"><span style="width: 22px; height: 4px; border-radius: 999px; background: #0E5A63"></span>Today</a>
    <a href="TeacherAttendance.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11.5px; font-weight: 500; color: #4F5B57"><span style="width: 22px; height: 4px"></span>Attendance</a>
    <a href="#classes" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11.5px; font-weight: 500; color: #4F5B57"><span style="width: 22px; height: 4px"></span>Classes</a>
    <a href="#me" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11.5px; font-weight: 500; color: #4F5B57"><span style="width: 22px; height: 4px"></span>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (time, cls, note, tag) => ({ time, cls, note, tag,
      noteColor: tag === 'Substitute' ? '#8F4A09' : '#4F5B57',
      tagBg: tag === 'Substitute' ? '#FFF6EC' : tag === 'Done' ? '#E4F1E8' : '#F1F2EF',
      tagFg: tag === 'Substitute' ? '#7A4106' : tag === 'Done' ? '#1E5A33' : '#4F5B57' });
    const periods = [
      p('08:00', '8-B Science', 'Ch. 6 Combustion — topic 2', 'Done'),
      p('08:40', '7-A Science', 'Lab: candle experiment', 'Next'),
      p('10:00', '6-A Science', 'For Rachna Bose (on leave)', 'Substitute'),
      p('11:10', '8-A Science', 'Half-yearly paper discussion', 'Later'),
      p('11:50', '8-B Science', 'Homework check', 'Later'),
      p('12:30', 'Free', 'Marks entry due 12 Oct', 'Later')
    ];
    return { periods };
  }
}
</script>
</body>
</html>
